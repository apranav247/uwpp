AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Unified Workforce Productivity Platform

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref Table

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: orgId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "64"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      ReadAttributes:
        - email
        - email_verified
        - name
        - custom:orgId
      WriteAttributes:
        - email
        - name

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
          - "http://localhost:5173"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwt

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/users/index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt Table.Arn
      LoggingConfig:
        LogGroup: !Ref UsersLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/users/index.js
        External:
          - '@aws-sdk/*'

  UsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/projects/index.handler
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /projects
            Method: GET
        PostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /projects
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: 
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt Table.Arn
      LoggingConfig:
        LogGroup: !Ref ProjectsLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/projects/index.js
        External:
          - '@aws-sdk/*'

  ProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/tasks/index.handler
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: GET
        PostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: POST
        PatchApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{taskId}
            Method: PATCH
      Policies:
        - Statement:
            - Effect: Allow
              Action: 
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${Table.Arn}/index/GSI1"
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      LoggingConfig:
        LogGroup: !Ref TasksLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/tasks/index.js
        External:
          - '@aws-sdk/*'

  TasksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  TasksErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TasksFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/notifications/index.handler
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt Table.Arn
      LoggingConfig:
        LogGroup: !Ref NotificationsLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/notifications/index.js
        External:
          - '@aws-sdk/*'

  NotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/metrics/index.handler
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /metrics
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt Table.Arn
      LoggingConfig:
        LogGroup: !Ref MetricsLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/metrics/index.js
        External:
          - '@aws-sdk/*'

  MetricsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/notifications/consumer.handler
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotificationTopic
      Events:
        TaskAssignedEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - workforce.tasks
              detail-type:
                - TaskAssigned
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationTopic
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: node22
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - backend/notifications/consumer.js
        External:
          - '@aws-sdk/*'

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  NotificationTopic:
    Type: AWS::SNS::Topic

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "uwpp-${AWS::AccountId}-${AWS::Region}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  DistributionId:
    Value: !Ref SiteDistribution
  NotificationTopicArn:
    Value: !Ref NotificationTopic
  TasksErrorsAlarmName:
    Value: !Ref TasksErrorsAlarm
